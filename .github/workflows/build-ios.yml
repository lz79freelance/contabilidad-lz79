name: Build iOS IPA (Flet)

on:
  workflow_dispatch: # Permite lanzar la compilación manualmente desde GitHub

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.x"
          channel: "stable"
          cache: true

      - name: Instalar Flet y dependencias del proyecto
        run: |
          python -m pip install --upgrade pip
          pip install flet qrcode openpyxl pillow

      - name: Compilar proyecto iOS (sin firma estricta inicial)
        run: |
          # Cambia org y project si usas otros identificadores
          flet build ipa --no-codesign --org com.lz79freelance --project lz79essential

      - name: Empaquetar Runner.app en formato .ipa
        run: |
          # Flutter genera la compilación en build/ios/iphoneos/Runner.app
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r lz79_unsigned.ipa Payload
          mv lz79_unsigned.ipa ../../../
          cd ../../../

      - name: Subir artefacto IPA
        uses: actions/upload-artifact@v4
        with:
          name: lz79-ios-ipa
          path: lz79_unsigned.ipa
          retention-days: 7
