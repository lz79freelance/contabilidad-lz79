name: Compilar APK para Amazon Appstore (Flet)

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configurar Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Flutter requerido por Flet
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install flet openpyxl pillow

      - name: Compilar APK con Flet
        run: |
          yes y | flet build apk --project "LZ79 Essential" --org com.lz79freelance

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: LZ79-Essential-Amazon-APK
          path: build/apk/*.apk
